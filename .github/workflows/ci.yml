name: ci

# A pull request gets static checks only. It has no AWS access, because the environments are limited to main.
# After a merge to main, the suite runs against Test. A change to the tests is itself tested against Test.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Loads the config and every test file. It runs no test and needs no URL.
      - run: npx playwright test --list

  e2e:
    if: ${{ github.event_name == 'push' }}
    needs: [check]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/run.yml
    with:
      environment: test
    secrets: inherit
